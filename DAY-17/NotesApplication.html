<!DOCTYPE html>
<html>
<head>
    <title>Notes Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center">Notes Application</h2>
    <textarea
        id="noteText"
        class="form-control"
        rows="5"
        placeholder="Enter Notes">
    </textarea>
    <br>
    <button class="btn btn-success" onclick="saveNote()">
        Save Notes
    </button>
    <button class="btn btn-danger" onclick="clearNotes()">
        Clear Notes
    </button>
    <br><br>
    <label class="fw-bold">Saved Notes</label>
    <textarea
        id="allNotes"
        class="form-control"
        rows="8"
        readonly>
    </textarea>
</div>
<script src="notes.js"></script>

</body>
</html>
